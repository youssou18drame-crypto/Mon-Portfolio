name: Actualiser la veille RSS
on:
  push:
    branches: [main]
    paths:
      - 'scripts/update_rss.py'
      - '.github/workflows/rss-veille.yml'
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
permissions:
  contents: write
jobs:
  refresh-rss:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Récupérer les flux RSS et Atom
        run: python scripts/update_rss.py
      - name: Publier les actualités si elles changent
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/veille-rss.json
          if ! git diff --cached --quiet; then
            git commit -m "Actualisation automatique des flux RSS"
            git push
          fi
